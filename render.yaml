services:
  # Flask Web Service
  - type: web
    name: flask-app
    plan: free
    runtime: python
    buildCommand: "cd flask-production-app && pip install -r requirements.txt && flask db upgrade"
    startCommand: "cd flask-production-app && gunicorn wsgi:app"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flask-db
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true

databases:
  - name: flask-db
    plan: free
